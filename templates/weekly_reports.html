<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NSS 周报</title>
  <link rel="icon" href="/ds/brand/favicon.ico" sizes="any">
  <style>{{ ds_css()|safe }}</style>
  <style>.container, .ant-header .in { max-width: 1080px; }</style>
</head>
<body>
  <header class="ant-header"><div class="in">
    <a class="brand" href="{{ url_for('index') }}"><img class="brand-logo" src="/ds/brand/logo-blue.png" alt="猛士" height="28">NSS 问卷提醒</a>
  </div></header>
  <main class="container">
    <header class="ant-page-header"><div class="ant-page-header-heading">
      <h1>NSS 周报</h1>
      <div class="ant-page-header-sub">北京时间周一至周日 · 提醒及填写按 VIN 去重</div>
    </div></header>
    <div class="ant-card"><div class="ant-card-body">
      {% if files %}
      <ul>
        {% for file in files %}
        <li><a href="{{ url_for('download_weekly_report', filename=file.name) }}">{{ file.week_start }} 当周明细 Excel</a> <span class="muted">{{ file.size_kb }} KB</span></li>
        {% endfor %}
      </ul>
      {% else %}
      <p class="muted">暂无周报。开发环境可通过 dry-run CLI 生成。</p>
      {% endif %}
      <p><a href="{{ url_for('index') }}">返回控制台</a></p>
    </div></div>
  </main>
</body>
</html>
